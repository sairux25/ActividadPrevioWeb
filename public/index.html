<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de ayuda</title>
  <!-- Tailwind por CDN: hace falta internet para que carguen los estilos -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="app.js" defer></script>
</head>
<!--
  Esta página todavía no tiene ninguna clase de Tailwind, por eso se ve
  tan plana. Darle forma es el nivel 0 del enunciado.
  Puedes añadir clases y contenedores, pero no cambies los id: app.js
  depende de ellos.
-->
<body>

  <header  class="max-w-6xl mx-auto px-4 pt-8 pb-4">
    <h1 class="text-3xl font-bold">Mesa de ayuda</h1>
    <p class="text-slate-600">Tickets de soporte de la oficina</p>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-8 grid gap-6 lg:grid-cols-3">

    <!-- Formulario: crea tickets y, desde el nivel 4, también los edita -->
    <section class="lg:col-span-1 bg-white rounded-lg shadow p-4">
      <h2 id="titulo-formulario" class="text-xl font-semibold mb-4">Nuevo ticket</h2>
 
      <form id="form-ticket" novalidate class="space-y-3">
 
        <div>
          <label for="titulo" class="block text-sm font-medium mb-1">Título</label>
          <input id="titulo" name="titulo" type="text"
                 class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
          <p id="error-titulo" class="text-sm text-red-600"></p>
        </div>
 
        <div>
          <label for="descripcion" class="block text-sm font-medium mb-1">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="3"
                    class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500"></textarea>
        </div>
 
        <div>
          <label for="solicitante" class="block text-sm font-medium mb-1">Solicitante</label>
          <input id="solicitante" name="solicitante" type="text"
                 class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
          <p id="error-solicitante" class="text-sm text-red-600"></p>
        </div>
 
        <div>
          <label for="categoria" class="block text-sm font-medium mb-1">Categoría</label>
          <select id="categoria" name="categoria"
                  class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="hardware">Hardware</option>
            <option value="software">Software</option>
            <option value="red">Red</option>
            <option value="accesos">Accesos</option>
          </select>
        </div>
 
        <div>
          <label for="prioridad" class="block text-sm font-medium mb-1">Prioridad</label>
          <select id="prioridad" name="prioridad"
                  class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>
 
        <button id="btn-guardar" type="submit"
                class="w-full rounded-md bg-sky-600 px-4 py-2 text-white font-medium hover:bg-sky-700">Crear ticket</button>
 
        <button id="btn-cancelar" type="button" hidden
                class="w-full rounded-md border border-slate-300 px-4 py-2 font-medium hover:bg-slate-100">Cancelar edición</button>
      </form>
    </section>
 
    <section class="lg:col-span-2 bg-white rounded-lg shadow p-4">
      <h2 class="text-xl font-semibold mb-4">Tickets</h2>
 
      <div id="resumen" class="text-sm text-slate-600 mb-4"></div>
 
      <div class="grid gap-3 md:grid-cols-2 mb-4">
        <div>
          <label for="filtro-estado" class="block text-sm font-medium mb-1">Estado</label>
          <select id="filtro-estado"
                  class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="todos">Todos</option>
            <option value="abierto">Abiertos</option>
            <option value="en_progreso">En progreso</option>
            <option value="resuelto">Resueltos</option>
          </select>
        </div>
 
        <div>
          <label for="busqueda" class="block text-sm font-medium mb-1">Buscar</label>
          <input id="busqueda" type="search" placeholder="Buscar por título"
                 class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
      </div>
 
      <p id="mensaje" class="text-sm text-slate-600"></p>
 
      <div id="lista-tickets" class="grid gap-4 md:grid-cols-2"></div>
    </section>
 
  </main>

</body>
</html>
